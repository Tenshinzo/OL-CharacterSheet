# Local development database only. Run the server with `npm run dev` in server/.
services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: olchar
      MYSQL_USER: olchar
      MYSQL_PASSWORD: olchar
    ports:
      - "3307:3306"
    volumes:
      - dbdata_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  dbdata_dev:
