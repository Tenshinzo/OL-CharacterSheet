# Application stack: app (Fastify) -> db (MySQL 8.4).
# TLS termination lives in a separate, shared stack (deploy/docker-compose.proxy.yml)
# that reaches the app through the external network `olchar-proxy`. This lets several
# instances (production, test) run side by side behind one Caddy.
#
# Usage on the server (as the deploy user, in the instance directory):
#   cp deploy/.env.production.example .env   # then fill in the secrets
#   docker compose -f docker-compose.prod.yml up -d
# Nothing here publishes ports; db is only reachable on this stack's default network,
# app additionally on `olchar-proxy` under the alias PROXY_ALIAS (see .env).
#
# Per-instance values read from .env:
#   COMPOSE_PROJECT_NAME  production leaves it unset (project "app", volumes app_*),
#                         the test instance sets olchar-test
#   PROXY_ALIAS           hostname Caddy proxies to: olchar-app (prod) / olchar-test-app
#   APP_IMAGE             image tag; must differ per instance
services:
  app:
    build: .
    image: ${APP_IMAGE:-olchar-app}
    env_file: ./.env
    restart: unless-stopped
    expose:
      - "3000"
    networks:
      default:
      proxy:
        aliases:
          - ${PROXY_ALIAS:-olchar-app}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
  proxy:
    name: olchar-proxy
    external: true

volumes:
  dbdata:
