name: Deploy

# push to main            -> production  https://ol-character.de       (/opt/olchar/app)
# manual run, any branch  -> test        https://test.ol-character.de  (/opt/olchar-test/app)
#   Actions -> Deploy -> Run workflow -> "Use workflow from: <feature branch>" -> target test.
# Manual runs may also target production (e.g. to roll back to a sha).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: "Instance to deploy to"
        type: choice
        options: [test, production]
        default: test
      ref:
        description: "Git ref (sha/tag) to deploy; defaults to the commit of the selected branch"
        required: false
        default: ""

env:
  # push (only main) -> production; manual run -> chosen target (default test)
  TARGET: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target) || (github.ref_name == 'main' && 'production') || 'test' }}

concurrency:
  group: deploy-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target) || (github.ref_name == 'main' && 'production') || 'test' }}
  cancel-in-progress: false

jobs:
  check:
    name: Lint & test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: olchar_test
          MYSQL_USER: olchar
          MYSQL_PASSWORD: olchar
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_USER: olchar
      DB_PASSWORD: olchar
      DB_NAME: olchar_test
      SECRET_KEY: ci-secret
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Docker image builds
        working-directory: .
        run: docker build -t olchar-app:ci .

  deploy:
    name: Deploy to ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target) || (github.ref_name == 'main' && 'production') || 'test' }}
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.target) || (github.ref_name == 'main' && 'production') || 'test' }}
      url: ${{ steps.target.outputs.url }}
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST || '178.104.37.74' }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || vars.DEPLOY_USER || 'deploy' }}
      DEPLOY_REF: ${{ github.event.inputs.ref != '' && github.event.inputs.ref || github.sha }}
    steps:
      - name: Resolve target instance
        id: target
        run: |
          set -euo pipefail
          case "$TARGET" in
            production)
              echo "app_dir=/opt/olchar/app"      >> "$GITHUB_OUTPUT"
              echo "with_proxy=1"                 >> "$GITHUB_OUTPUT"
              echo "url=https://ol-character.de"  >> "$GITHUB_OUTPUT" ;;
            test)
              echo "app_dir=/opt/olchar-test/app"     >> "$GITHUB_OUTPUT"
              echo "with_proxy=0"                     >> "$GITHUB_OUTPUT"
              echo "url=https://test.ol-character.de" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::unknown target '$TARGET'" >&2; exit 1 ;;
          esac
          echo "Deploying $DEPLOY_REF to $TARGET"
      - name: Prepare SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/deploy_key <<'KEY'
          ${{ secrets.DEPLOY_SSH_KEY }}
          KEY
          chmod 600 ~/.ssh/deploy_key
          # Fail fast with a clear message if the secret is not a complete private key.
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            echo "::error::DEPLOY_SSH_KEY is not a valid private key. Paste the COMPLETE file including the BEGIN/END lines ($(wc -l < ~/.ssh/deploy_key) lines received)." >&2
            exit 1
          fi
          echo "Deploy key fingerprint: $(ssh-keygen -lf ~/.ssh/deploy_key.pub)"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Run deploy.sh on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_DIR='$APP_DIR' WITH_PROXY='$WITH_PROXY' bash '$APP_DIR/deploy/deploy.sh' '$DEPLOY_REF'"
        env:
          APP_DIR: ${{ steps.target.outputs.app_dir }}
          WITH_PROXY: ${{ steps.target.outputs.with_proxy }}
      - name: Verify public health endpoint
        env:
          URL: ${{ steps.target.outputs.url }}
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "$URL/api/health" | grep -q '"ok":true'; then
              echo "healthy"; exit 0
            fi
            sleep 5
          done
          echo "public health check failed" >&2
          exit 1
      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key
